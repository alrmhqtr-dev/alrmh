databases:
  - name: alrmh-db
    plan: free
    databaseName: alrmh
    user: alrmh

services:
  - type: web
    name: alrmh-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: alrmh-db
          property: connectionString
      - key: SEED_ON_START
        value: 'true'
      - key: SEED_DEMO
        value: 'true'
      - key: OTP_MODE
        value: preview
      - key: OTP_PREVIEW_CODE
        value: '123456'
      - key: PAYMENT_MODE
        value: mock
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: alrmh-admin
    runtime: static
    rootDir: apps/admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
