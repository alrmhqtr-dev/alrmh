name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/pwa.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_BASE_URL: ${{ vars.PWA_BASE_URL != '' && vars.PWA_BASE_URL || format('/{0}', github.event.repository.name) }}
      EXPO_PUBLIC_BASE_URL: ${{ vars.PWA_BASE_URL != '' && vars.PWA_BASE_URL || format('/{0}', github.event.repository.name) }}
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Check API URL is set
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then echo "Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables)"; exit 1; fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
